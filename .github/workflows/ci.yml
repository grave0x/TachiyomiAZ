name: CI Build & Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Build & Verify APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check shared modules portability
        run: ./gradlew checkSharedPortability --no-daemon

      - name: Build Debug APKs
        run: ./gradlew assembleStandardApi21Debug assembleStandardApi24Debug --no-daemon

      - name: Upload API 21 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TachiyomiAZ-Api21-Debug
          path: app/build/outputs/apk/standardApi21/debug/*.apk
          if-no-files-found: warn

      - name: Upload API 24 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TachiyomiAZ-Api24-Debug
          path: app/build/outputs/apk/standardApi24/debug/*.apk
          if-no-files-found: warn
